name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      project:
        description: "Which tests should run?"
        required: true
        type: choice
        options:
          - all
          - alphabet-cipher
          - card-game-war
          - doublets
          - fox-goose-bag-of-corn
          - magic-square
          - tiny-maze

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: sbt/setup-sbt@v1

      - uses: dorny/paths-filter@v4
        id: changes
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            alphabet-cipher:
              - 'alphabet-cipher/**'
            card-game-war:
              - 'card-game-war/**'
            doublets:
              - 'doublets/**'
            fox-goose-bag-of-corn:
              - 'fox-goose-bag-of-corn/**'
            magic-square:
              - 'magic-square/**'
            tiny-maze:
              - 'tiny-maze/**'

      - name: Test alphabet-cipher
        if: (github.event_name == 'workflow_dispatch' && (inputs.project == 'all' || inputs.project == 'alphabet-cipher')) || (github.event_name != 'workflow_dispatch' && steps.changes.outputs.alphabet-cipher == 'true')
        working-directory: alphabet-cipher
        run: sbt test

      - name: Test card-game-war
        if: (github.event_name == 'workflow_dispatch' && (inputs.project == 'all' || inputs.project == 'card-game-war')) || (github.event_name != 'workflow_dispatch' && steps.changes.outputs.card-game-war == 'true')
        working-directory: card-game-war
        run: sbt test

      - name: Test doublets
        if: (github.event_name == 'workflow_dispatch' && (inputs.project == 'all' || inputs.project == 'doublets')) || (github.event_name != 'workflow_dispatch' && steps.changes.outputs.doublets == 'true')
        working-directory: doublets
        run: sbt test

      - name: Test fox-goose-bag-of-corn
        if: (github.event_name == 'workflow_dispatch' && (inputs.project == 'all' || inputs.project == 'fox-goose-bag-of-corn')) || (github.event_name != 'workflow_dispatch' && steps.changes.outputs.fox-goose-bag-of-corn == 'true')
        working-directory: fox-goose-bag-of-corn
        run: sbt test

      - name: Test magic-square
        if: (github.event_name == 'workflow_dispatch' && (inputs.project == 'all' || inputs.project == 'magic-square')) || (github.event_name != 'workflow_dispatch' && steps.changes.outputs.magic-square == 'true')
        working-directory: magic-square
        run: sbt test

      - name: Test tiny-maze
        if: (github.event_name == 'workflow_dispatch' && (inputs.project == 'all' || inputs.project == 'tiny-maze')) || (github.event_name != 'workflow_dispatch' && steps.changes.outputs.tiny-maze == 'true')
        working-directory: tiny-maze
        run: sbt test
