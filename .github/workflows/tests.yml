
name: Scala tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: sbt/setup-sbt@v1

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            doublets:
              - 'doublets/**'
            alphabet-cipher:
              - 'alphabet-cipher/**'
            fox-goose-bag-of-corn:
              - 'fox-goose-bag-of-corn/**'

      - name: Test doublets
        if: steps.changes.outputs.doublets == 'true'
        working-directory: doublets
        run: sbt test

      - name: Test alphabet-cipher
        if: steps.changes.outputs.alphabet-cipher == 'true'
        working-directory: alphabet-cipher
        run: sbt test

      - name: Test fox-goose-bag-of-corn
        if: steps.changes.outputs.fox-goose-bag-of-corn == 'true'
        working-directory: fox-goose-bag-of-corn
        run: sbt test